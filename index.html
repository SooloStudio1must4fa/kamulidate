<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة خاصة 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1f3;--bg2:#fbd0da;--rose:#c9475f;--wine:#6b1d33;--gold:#b98b4a;--ink:#3d1220;--card:rgba(255,255,255,.6);--line:rgba(185,139,74,.4);--serif:'Amiri',Georgia,serif;--sans:'Cairo',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg1:#25091a;--bg2:#4a1627;--rose:#f08aa0;--wine:#ffd9e0;--gold:#e0b778;--ink:#ffeef1;--card:rgba(255,255,255,.07);--line:rgba(224,183,120,.38)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);color:var(--ink);min-height:100vh;background:radial-gradient(110% 80% at 85% 0%,var(--bg2),transparent 60%),radial-gradient(100% 80% at 0% 100%,var(--bg2),transparent 55%),var(--bg1);background-attachment:fixed;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-30px;width:14px;height:18px;background:linear-gradient(135deg,#ff9fb2,#d94f6c);border-radius:80% 0 80% 0;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:26px 18px 60px}
.step{display:none}.step.on{display:block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.glass{position:relative;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:30px;padding:34px 22px;box-shadow:0 24px 70px -22px rgba(107,29,51,.45)}
.hero{text-align:center}
.crest{font:italic 14px 'Playfair Display',serif;letter-spacing:.3em;color:var(--gold);margin-bottom:16px}
h1{font-family:var(--serif);font-size:clamp(38px,11vw,60px);line-height:1.3;color:var(--wine)}
.gold{background:linear-gradient(100deg,var(--gold),#f3d28f,var(--rose),var(--gold));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.rule{width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto}
.lead{font-family:var(--serif);font-size:22px;line-height:2;margin:0 auto 22px;max-width:28ch}
.when{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 20px;margin-bottom:26px;font-weight:600;color:var(--wine);background:var(--card)}
h2{font-family:var(--serif);font-size:32px;color:var(--wine);text-align:center;margin-bottom:6px}
.sub{text-align:center;opacity:.78;font-size:15px;margin-bottom:22px}
.btn{display:block;width:100%;border:0;cursor:pointer;font:700 17px var(--sans);color:#fff;padding:16px 22px;border-radius:999px;background:linear-gradient(135deg,#e0607b,#a52d4a);box-shadow:0 12px 30px -8px rgba(165,45,74,.65);transition:transform .2s,opacity .2s;min-height:52px;text-align:center;text-decoration:none}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--wine);box-shadow:none;border:1px solid var(--line);margin-top:10px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#yes{transition:font-size .3s,padding .3s}
#no{margin-top:12px;z-index:20;width:auto;min-width:130px;padding:12px 22px;transition:left .35s cubic-bezier(.3,1.6,.5,1),top .35s cubic-bezier(.3,1.6,.5,1),font-size .3s}
#no.run{position:fixed;margin:0}
#joke{min-height:30px;margin-top:16px;font:700 18px var(--serif);color:var(--rose);text-align:center}
.env{text-align:center;padding:46px 22px}
.seal{width:116px;height:116px;border-radius:50%;margin:24px auto;border:0;cursor:pointer;font-size:46px;color:#ffe3ea;background:radial-gradient(circle at 35% 30%,#e0607b,#8d1f3d 70%);box-shadow:0 0 0 8px rgba(201,71,95,.18),0 18px 40px -8px rgba(141,31,61,.7);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.1);box-shadow:0 0 0 18px rgba(201,71,95,.08),0 18px 40px -8px rgba(141,31,61,.7)}}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:20px}.dots i{width:26px;height:4px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--rose);width:40px}
.grid{display:grid;gap:12px;margin-bottom:14px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);transition:.25s;min-height:62px}
.opt:hover{transform:translateY(-2px);border-color:var(--rose)}.opt:focus-visible{outline:3px solid var(--gold)}
.opt[aria-pressed=true]{border-color:var(--rose);background:linear-gradient(135deg,rgba(216,90,116,.2),rgba(185,139,74,.15));box-shadow:0 8px 24px -10px rgba(201,71,95,.7)}
.ic{font-size:30px;flex:none;width:44px;text-align:center}
.opt b{display:block;font:700 19px var(--serif);color:var(--wine)}.opt small{display:block;opacity:.78;font-size:13.5px;line-height:1.6;margin-top:2px}
.own{width:100%;font:500 16px var(--sans);color:var(--ink);padding:14px 18px;border-radius:18px;border:1.5px dashed var(--gold);background:var(--card);margin-bottom:20px;text-align:right}
.own::placeholder{color:var(--ink);opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}.chips .opt{padding:12px 20px;min-height:48px;font-weight:600}
.ticket{border:1.5px dashed var(--gold);border-radius:22px;padding:20px;margin:8px 0 22px;background:var(--card);line-height:2.1;font-size:17px;text-align:right}
.ticket div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line)}.ticket div:last-child{border:0}
.ticket span{opacity:.7}.ticket strong{font:700 19px var(--serif);color:var(--wine);text-align:left}
.fl{position:fixed;bottom:-30px;z-index:30;pointer-events:none;animation:up 3.4s ease-in forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.foot{text-align:center;margin-top:24px;font:italic 15px 'Playfair Display',serif;color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}#petals{display:none}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>
<main>

<section class="step on" id="s0"><div class="glass env">
  <div class="crest">— PRIVATE INVITATION —</div>
  <h2>إلى <span class="gold" id="her0"></span></h2>
  
  <button class="seal" aria-label="افتحي الظرف" onclick="openEnv()">💌</button>
  <p class="sub">دوسي ع الختم</p>
</div></section>

<section class="step" id="s1"><div class="glass hero">
  <div class="crest">من <b id="him1"></b> إلى <b id="her1"></b></div>
  <h1>يا <span class="gold" id="her2"></span>،<br>عندي إلك دعوة</h1>
  <div class="rule"></div>
  <p class="lead">بدي ياكي تطلعي معي ديت 🤍</p>
  <div class="when">📅 الأربعاء ٠٧/١٠/٢٠٢٦</div>
  <button class="btn" id="yes" onclick="accept()">موافقة، يلا نطلع! 💖</button>
  <button class="btn ghost" id="no">أرفض الدعوة 😌</button>
  <div id="joke" aria-live="polite"></div>
</div></section>

<section class="step" id="s2" data-dot="1"><div class="glass">
  <div class="dots"></div>
  <h2>وين بدك نروح؟</h2>
  <div class="grid" data-key="place">
    <button class="opt" aria-pressed="false" data-v="Zoom Cafe"><span class="ic">🌿</span><span><b>Zoom Cafe</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Pera Cafe"><span class="ic">🕯️</span><span><b>Pera Cafe</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Pauqa"><span class="ic">🍰</span><span><b>Pauqa</b></span></button>
    <button class="opt" aria-pressed="false" data-v="مفاجأة على ذوق مصطفى"><span class="ic">💝</span><span><b>ع ذوق خطيبك</b></span></button>
  </div>
  <button class="btn" disabled onclick="go(3)">التالي</button>
</div></section>

<section class="step" id="s3" data-dot="2"><div class="glass">
  <div class="dots"></div>
  <h2>شو بدك تشربي؟</h2>
  <div class="grid" data-key="drink">
    <button class="opt" aria-pressed="false" data-v="Latte"><span class="ic">☕</span><span><b>Latte</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Mocha"><span class="ic">🍫</span><span><b>Mocha</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Sahlep"><span class="ic">🥛</span><span><b>Sahlep</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Türk Kahvesi"><span class="ic">🫖</span><span><b>Türk Kahvesi</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Strawberry Milkshake"><span class="ic">🍓</span><span><b>Strawberry Milkshake</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Sıcak Çikolata"><span class="ic">🤎</span><span><b>Sıcak Çikolata</b></span></button>
  </div>
  <input class="own" data-for="drink" placeholder="✍️ أو اكتبي شو بدك تشربي…" maxlength="60">
  <button class="btn" disabled onclick="go(4)">التالي</button>
  <button class="btn ghost" onclick="go(2)">رجوع</button>
</div></section>

<section class="step" id="s4" data-dot="3"><div class="glass">
  <div class="dots"></div>
  <h2>وشو بدك تتحلي؟</h2>
  <div class="grid" data-key="dessert">
    <button class="opt" aria-pressed="false" data-v="San Sebastian Cheesecake"><span class="ic">🧁</span><span><b>San Sebastian</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Tiramisu"><span class="ic">🍮</span><span><b>Tiramisu</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Waffle"><span class="ic">🧇</span><span><b>Waffle</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Profiterol"><span class="ic">🍩</span><span><b>Profiterol</b></span></button>
    <button class="opt" aria-pressed="false" data-v="Künefe"><span class="ic">🍯</span><span><b>Künefe</b></span></button>
  </div>
  <input class="own" data-for="dessert" placeholder="✍️ أو اكتبي حلو تاني بيعجبك…" maxlength="60">
  <button class="btn" disabled onclick="go(5)">التالي</button>
  <button class="btn ghost" onclick="go(3)">رجوع</button>
</div></section>

<section class="step" id="s5" data-dot="4"><div class="glass">
  <div class="dots"></div>
  <h2>أي ساعة؟</h2><p class="sub">الأربعاء ٠٧/١٠/٢٠٢٦</p>
  <div class="chips" data-key="time">
    <button class="opt" aria-pressed="false" data-v="8:00 مساءً">٨:٠٠</button>
    <button class="opt" aria-pressed="false" data-v="9:00 مساءً">٩:٠٠</button>
  </div>
  <button class="btn" disabled onclick="done()">تأكيد الموعد 💌</button>
  <button class="btn ghost" onclick="go(4)">رجوع</button>
</div></section>

<section class="step" id="s6"><div class="glass hero">
  <div class="crest">— CONFIRMED —</div>
  <h2 style="font-size:40px">موعدنا جاهز 🤍</h2>
  <p class="sub" style="margin-top:8px">منشوفك قريب 🤍</p>
  <div class="ticket" id="ticket"></div>
  <a class="btn" id="wa" target="_blank" rel="noopener">ابعتيلي ردك ع واتساب 💬</a>
  <button class="btn ghost" onclick="go(2)">بدي غيّر شي</button>
  
</div></section>
</main>

<script>
// ✏️ عدّل هون
const HER="كاميليا", HIM="مصطفى";
const HIS_PHONE="905523223191"; // رقم واتساب مصطفى
const DATE="الأربعاء 07/10/2026";

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],pick={};
['her0','her1','her2'].forEach(i=>$('#'+i).textContent=HER);$('#him1').textContent=HIM;

const pw=$('#petals');
for(let i=0;i<20;i++){const p=document.createElement('span');p.className='petal';p.style.left=Math.random()*100+'%';p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.animationDuration=(9+Math.random()*10)+'s';p.style.animationDelay=(-Math.random()*14)+'s';pw.appendChild(p)}
$$('[data-dot]').forEach(s=>{const n=+s.dataset.dot,d=$('.dots',s);for(let i=1;i<=4;i++){const e=document.createElement('i');if(i<=n)e.className='on';d.appendChild(e)}});

function go(n){$$('.step').forEach(s=>s.classList.remove('on'));$('#s'+n).classList.add('on');window.scrollTo({top:0,behavior:'smooth'})}
function fx(n,set=['💗','🌹','✨','💖','🥰']){for(let i=0;i<n;i++){const h=document.createElement('span');h.className='fl';h.textContent=set[Math.floor(Math.random()*set.length)];h.style.left=Math.random()*100+'%';h.style.fontSize=(18+Math.random()*24)+'px';h.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),4400)}}
function openEnv(){fx(14);go(1)}
function accept(){fx(40);go(2)}

// الرفض: الزر بيهرب 😂
const jokes=["ولا… الزر هرب منك 😂","راجعي قرارك يا ",  "شو؟ بدك ترفضي مصطفى؟ 🥺","هالزر خايف منك، ما بدو ينضغط","مصطفى هلأ عم يبكي بالزاوية 😭","القهوة والكيك عم يستنوكي!","ما في رفض بهالدعوة، جربي تاني 😏","آخر فرصة… دغري ع الموافقة 😅","خلص خلص، اعتبريها موافقة 😎"];
const nos=["أرفض 😌","متأكدة؟","فكري مرة تانية","ولو؟!","عنجد؟","لا لا لا","طيب جربي","أرفض بعد؟!","خلص استسلمت"];
let tries=0;const no=$('#no'),yes=$('#yes');
function dodge(e){
  if(e&&e.cancelable)e.preventDefault();
  tries++;
  if(tries>=9){$('#joke').textContent=jokes[8];fx(30);setTimeout(accept,1200);no.style.display='none';return}
  const w=no.offsetWidth||140,h=no.offsetHeight||48;
  no.classList.add('run');
  no.style.left=Math.max(8,Math.random()*(innerWidth-w-16))+'px';
  no.style.top=Math.max(70,Math.random()*(innerHeight-h-90))+'px';
  no.textContent=nos[Math.min(tries,8)];
  no.style.fontSize=Math.max(11,17-tries)+'px';
  yes.style.fontSize=(17+tries*2)+'px';yes.style.padding=(16+tries*2)+'px 22px';
  $('#joke').textContent=jokes[Math.min(tries-1,7)]+(tries===2?HER+"!":"");
  fx(2,['😂','🥺','💔']);
}
['pointerenter','touchstart','click','focus'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));

// الاختيارات
document.addEventListener('click',e=>{
  const o=e.target.closest('.opt');if(!o)return;
  const g=o.closest('[data-key]'),k=g.dataset.key;
  $$('.opt',g).forEach(x=>x.setAttribute('aria-pressed','false'));o.setAttribute('aria-pressed','true');
  pick[k]=o.dataset.v;const own=$(`.own[data-for=${k}]`);if(own)own.value='';
  check(o.closest('.step'));fx(3);
});
$$('.own').forEach(i=>i.addEventListener('input',()=>{
  const k=i.dataset.for,g=$(`[data-key=${k}]`);
  $$('.opt',g).forEach(x=>x.setAttribute('aria-pressed','false'));
  const v=i.value.trim();v?pick[k]=v:delete pick[k];check(i.closest('.step'))
}));
function check(s){const b=$('.btn:not(.ghost)',s);b.disabled=!$$('[data-key]',s).every(x=>pick[x.dataset.key])}

function done(){
  const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const r=[['المكان',pick.place],['المشروب',pick.drink],['الحلو',pick.dessert],['اليوم',DATE],['الساعة',pick.time]];
  $('#ticket').innerHTML=r.map(x=>`<div><span>${x[0]}</span><strong>${esc(x[1])}</strong></div>`).join('');
  const m=`💌 وافقت ع الدعوة!\nالمكان: ${pick.place}\nالمشروب: ${pick.drink}\nالحلو: ${pick.dessert}\nاليوم: ${DATE}\nالساعة: ${pick.time}\n\nجاهزة يا ${HIM} 🤍`;
  $('#wa').href='https://wa.me/'+HIS_PHONE+'?text='+encodeURIComponent(m);
  go(6);fx(45);
}
</script>
</body>
</html>
